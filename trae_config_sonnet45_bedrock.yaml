agents:
    trae_agent:
        enable_lakeview: false
        model: sonnet45_bedrock
        max_steps: 200
        tools:
            - bash
            - str_replace_based_edit_tool
            - sequentialthinking
            - task_done

model_providers:
    bedrock:
        provider: bedrock
        # Uses AWS credentials from environment (AWS_PROFILE, AWS_REGION, etc.)

models:
    sonnet45_bedrock:
        model_provider: bedrock
        model: us.anthropic.claude-sonnet-4-5-20250929-v1:0
        max_tokens: 8192
        temperature: 0.5
        top_p: 1
        top_k: 0
        max_retries: 10
        parallel_tool_calls: true
